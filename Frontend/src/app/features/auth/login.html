<div class="min-h-screen flex items-center justify-center bg-linear-to-br from-[#0b1f3a] via-[#0f172a] to-[#111827]">

  <div class="w-full max-w-md p-8 rounded-2xl border border-white/10
              bg-white/5 backdrop-blur-xl shadow-2xl">

    <!-- LOGIN -->
    <div *ngIf="isLoginMode">
      <h2 class="text-3xl font-bold mb-6 text-center text-white">Login</h2>

      <input [(ngModel)]="email" type="email" placeholder="Email"
        class="w-full p-3 mb-4 rounded-lg bg-black/30 text-white
               outline-none border border-white/10 focus:border-blue-400"/>

      <input [(ngModel)]="password" type="password" placeholder="Password"
        class="w-full p-3 mb-4 rounded-lg bg-black/30 text-white
               outline-none border border-white/10 focus:border-blue-400"/>

      <button (click)="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg transition font-semibold">
        Login
      </button>

    </div>

  </div>
</div>
