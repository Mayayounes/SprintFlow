<div class="text-white min-h-screen p-6">

  <!-- TITLE -->
  <h1 class="text-3xl font-bold text-center mb-10">
    Statistics Dashboard
  </h1>

  <!-- LOADING -->
  <div *ngIf="loading" class="flex justify-center items-center py-20">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  </div>

  <!-- DASHBOARD -->
  <div *ngIf="!loading && role === 'admin'" class="max-w-6xl mx-auto space-y-8">

    <!-- USERS BIG CARD -->
    <div class="bg-white/10 p-8 rounded-2xl backdrop-blur-xl shadow-lg text-center">

      <h2 class="text-2xl font-semibold text-gray-300 mb-4">
        Users
      </h2>

      <p class="text-6xl font-bold text-blue-400 mb-6">
        {{ stats.users }}
      </p>

      <!-- SUB STATS CENTERED -->
      <div class="grid md:grid-cols-3 gap-4 text-center">

        <div class="bg-white/5 p-4 rounded-xl">
          <p class="text-gray-300">Admins</p>
          <p class="text-2xl font-bold text-red-400">{{ stats.admins }}</p>
        </div>

        <div class="bg-white/5 p-4 rounded-xl">
          <p class="text-gray-300">Leaders</p>
          <p class="text-2xl font-bold text-purple-400">{{ stats.leaders }}</p>
        </div>

        <div class="bg-white/5 p-4 rounded-xl">
          <p class="text-gray-300">Employees</p>
          <p class="text-2xl font-bold text-yellow-400">{{ stats.employees }}</p>
        </div>

      </div>

    </div>
    <!-- PROJECTS BIG CARD -->
    <div class="bg-white/10 p-8 rounded-2xl backdrop-blur-xl shadow-lg text-center">

      <h2 class="text-2xl text-gray-300 mb-4">
        Projects
      </h2>

      <p class="text-6xl font-bold text-green-400">
        {{ stats.projects }}
      </p>

      <p class="text-gray-400 mt-2">
        Active projects in system
      </p>

    </div>

  </div>

  <!-- LEADER VIEW -->
  <div *ngIf="!loading && role === 'leader'" class="flex justify-center">

    <div class="bg-white/10 p-8 rounded-2xl text-center backdrop-blur-xl shadow-lg w-96">

      <h2 class="text-xl text-gray-300 mb-3">My Projects</h2>

      <p class="text-5xl font-bold text-blue-400">
        {{ stats.projects }}
      </p>

    </div>

  </div>

</div>
