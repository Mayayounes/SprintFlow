<div class="relative z-9999 notification-wrapper">
  <!-- Bell -->
  <button (click)="toggleDropdown()" class="relative text-white">

    <i class="fa-solid fa-bell text-2xl"></i>

<span *ngIf="hasNewNotification"
      class="absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full">
</span>
    <span *ngIf="showDropdown && unreadCount > 0" class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full px-2">
      {{ unreadCount }}
    </span>

  </button>
  <!-- Dropdown -->
  <div *ngIf="showDropdown" class="absolute right-0 top-full mt-3 w-96
            bg-[#0f172a]
            border border-white/10
            rounded-xl
            shadow-2xl
            overflow-hidden
            z-9999">

    <div class="p-4 border-b border-white/10 flex justify-between">

      <h3 class="font-semibold">
        Notifications
      </h3>
      <button *ngIf="unreadCount > 0" (click)="markAllRead()" class="text-xs text-blue-400">
        Mark all read
      </button>
    </div>

    <div class="max-h-80 overflow-y-auto">

      <div *ngFor="let n of notifications  trackBy: trackByNotification" (click)="!n.isRead && markAsRead(n)" class="cursor-pointer">
        <div [ngClass]="{
            'bg-blue-500/20': !n.isRead,
            'hover:bg-white/10': true
          }" class="p-4 border-b border-white/10">

          <div class="flex justify-between">

            <div>

              <div class="text-sm">
                {{ n.message }}
              </div>

              <div class="text-xs text-gray-400 mt-1">
                {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}
              </div>

            </div>

            <span *ngIf="!n.isRead" class="w-2 h-2 bg-blue-500 rounded-full mt-2">
            </span>

          </div>

        </div>

      </div>

      <div *ngIf="notifications.length === 0" class="p-6 text-center text-gray-400">

        No notifications

      </div>

    </div>

  </div>

</div>
