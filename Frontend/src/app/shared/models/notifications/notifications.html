<div class="relative z-9999 notification-wrapper">
  <!-- Bell -->
  <button (click)="toggleDropdown()" class="relative text-white">

    <i class="fa-solid fa-bell text-2xl"></i>

    <span *ngIf="hasNewNotification" class="absolute -top-1 -right-1 w-3 h-3 bg-blue-500 rounded-full">
    </span>
    <span *ngIf="showDropdown && unreadCount > 0" class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full px-2">
      {{ unreadCount }}
    </span>

  </button>
  <!-- Dropdown -->
  <div *ngIf="showDropdown" class="absolute right-0 top-full mt-3 w-96
            bg-[#0f172a]
            border border-white/10
            rounded-xl
            shadow-2xl
            overflow-hidden
            z-9999">

    <!-- HEADER (NOT scrollable) -->
    <div class="p-4 border-b border-white/10">

      <div class="flex justify-between items-center mb-3">
        <h3 class="font-semibold text-white text-sm">
          Notifications
        </h3>

        <button *ngIf="unreadCount > 0" (click)="markAllRead()" class="text-xs text-blue-400">
          Mark all read
        </button>
      </div>
      <div class="flex gap-2">

        <button (click)="changeFilter('All')" [ngClass]="selectedFilter === 'All'
      ? 'bg-blue-500 text-white'
      : 'bg-white/10 text-gray-300 hover:bg-white/20'" class="px-3 py-1 rounded-lg text-xs transition">

          All
        </button>

        <button (click)="changeFilter('Unread')" [ngClass]="selectedFilter === 'Unread'
      ? 'bg-blue-500 text-white'
      : 'bg-white/10 text-gray-300 hover:bg-white/20'" class="px-3 py-1 rounded-lg text-xs transition">

          Unread
        </button>

        <button (click)="changeFilter('Seen')" [ngClass]="selectedFilter === 'Seen'
      ? 'bg-blue-500 text-white'
      : 'bg-white/10 text-gray-300 hover:bg-white/20'" class="px-3 py-1 rounded-lg text-xs transition">

          Seen
        </button>

      </div>
    </div>

    <div class="max-h-80 overflow-y-auto" (scroll)="onScroll($event)">

      <div *ngFor="let n of notifications; trackBy: trackByNotification" (click)="!n.isRead && markAsRead(n)"
        class="cursor-pointer">

        <div class="p-4 border-b border-white/10" [ngClass]="{
             'bg-blue-500/20': !n.isRead,
             'hover:bg-white/10': true
           }">

          <div class="text-sm font-medium text-white">
            {{ n.message }}
          </div>

          <div class="text-xs text-gray-400 mt-2 space-y-1">

            <!-- Created -->
            <!-- <div>
              🕒 Created:
              {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}
              <div *ngIf="n.isRead">
                👁 Seen:
                {{ n.updatedAt | date:'dd/MM/yyyy HH:mm' }}
                <div *ngIf="!n.isRead">
                  ⏳ Not read yet
                </div> -->

              </div>
            </div>

          </div>

          <div *ngIf="notifications.length === 0" class="p-6 text-center text-gray-400">
            No notifications
          </div>

        </div>
      </div>
    </div>
